<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unicorn Academy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unicorn Academy">
<meta name="theme-color" content="#E6F2FA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Fonts are served from this server (public/fonts), so the app works without internet. */
@font-face { font-family: "Baloo 2"; src: url("fonts/baloo2.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
@font-face { font-family: "Andika"; src: url("fonts/andika-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Andika"; src: url("fonts/andika-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: a meadow-and-sky stable. One centered column (max 960px), activity tiles in a grid,
   play screens split question | number pad side by side on an iPad, stacked on narrow screens. */
:root {
  --sky: #E6F2FA;
  --sky-deep: #CFE5F3;
  --card: #FFFFFF;
  --ink: #2A3147;
  --ink-soft: #5B6479;
  --line: #CCDCE8;
  --meadow: #3B9A6C;
  --meadow-deep: #2A7451;
  --meadow-soft: #DDF1E6;
  --rose: #E4507A;
  --rose-deep: #B83560;
  --rose-soft: #FCE3EB;
  --gold: #F2B530;
  --gold-deep: #C98C0E;
  --gold-soft: #FFF2CF;
  --lav: #8E78D8;
  --lav-soft: #ECE6FB;
  --saddle: #8A5A3B;
  --saddle-soft: #F4E8DC;
  --warn: #E07A2E;
  --peach: #C2621F;
  --peach-soft: #FDE6D3;
  --teal: #23807F;
  --teal-soft: #D5EFEE;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Andika", "Verdana", system-ui, sans-serif;
  --r: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--sky); }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
#app { max-width: 960px; margin: 0 auto; padding-block: 12px 48px; display: flex; flex-direction: column; gap: 18px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 10px 22px; border-radius: 18px; border: 0;
  font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .01em;
  background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line);
  transition: transform .08s, box-shadow .08s; user-select: none; -webkit-user-select: none;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--meadow); color: #fff; box-shadow: 0 4px 0 var(--meadow-deep); }
.btn.primary:active { box-shadow: 0 1px 0 var(--meadow-deep); }
.btn.rose { background: var(--rose); color: #fff; box-shadow: 0 4px 0 var(--rose-deep); }
.btn.rose:active { box-shadow: 0 1px 0 var(--rose-deep); }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 var(--gold-deep); }
.btn.small { min-height: 44px; font-size: 17px; padding: 6px 16px; border-radius: 14px; }
.btn.big { min-height: 72px; font-size: 26px; padding: 12px 30px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.linkbtn { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font-size: 16px; padding: 8px; }

.card { background: var(--card); border-radius: var(--r); border: 2px solid var(--line); padding: 20px; }
.muted { color: var(--ink-soft); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.center { text-align: center; align-items: center; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; }
.top h1 { font-size: 28px; flex: 1; min-width: 0; }
.back { min-height: 48px; padding: 6px 16px 6px 12px; border-radius: 14px; border: 0; background: var(--card); box-shadow: 0 3px 0 var(--line); font-family: var(--display); font-weight: 700; font-size: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--display); font-weight: 700; font-size: 19px; box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE79A, var(--gold) 55%, var(--gold-deep)); box-shadow: inset 0 0 0 2px var(--gold-deep); display: inline-block; flex: none; }
.ico { width: 26px; height: 26px; flex: none; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.stage { position: relative; border-radius: 26px; overflow: hidden; border: 2px solid var(--line); background: var(--card); min-height: 260px; display: flex; flex-direction: column; justify-content: flex-end; }
.stage svg.uni { width: 100%; height: auto; display: block; }
.bubble { margin: 12px; background: var(--card); border-radius: 18px; padding: 10px 14px; font-size: 17px; box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.hello h2 { font-size: 40px; color: var(--meadow-deep); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border-radius: 16px; border: 2px solid var(--line); padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.stat b { font-family: var(--display); font-size: 26px; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-soft); }
.reward { background: var(--gold-soft); border: 2px solid var(--gold); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.meter { height: 14px; border-radius: 999px; background: rgba(42, 49, 71, .1); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--meadow); }
.meter.gold i { background: var(--gold-deep); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { border: 0; border-radius: 22px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 140px; box-shadow: 0 5px 0 rgba(42, 49, 71, .14); transition: transform .08s; }
.tile:active { transform: translateY(3px); }
.tile h3 { font-size: 22px; }
.tile p { font-size: 15px; color: var(--ink-soft); }
.tile .ico { width: 44px; height: 44px; }
.t-teach { background: var(--lav-soft); } .t-teach .ico { color: var(--lav); }
.t-gallop { background: var(--rose-soft); } .t-gallop .ico { color: var(--rose); }
.t-work { background: var(--meadow-soft); } .t-work .ico { color: var(--meadow); }
.t-hw { background: var(--sky-deep); } .t-hw .ico { color: #2F78B0; }
.t-shop { background: var(--gold-soft); } .t-shop .ico { color: var(--gold-deep); }
.t-badge { background: var(--saddle-soft); } .t-badge .ico { color: var(--saddle); }
.t-num { background: var(--peach-soft); } .t-num .ico { color: var(--peach); }
.t-area { background: var(--teal-soft); } .t-area .ico { color: var(--teal); }
.ride-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--meadow); color: #fff; border-radius: 24px; padding: 18px 22px; box-shadow: 0 5px 0 var(--meadow-deep); }
.ride-cta h2 { font-size: 30px; }
.ride-cta p { opacity: .92; }
.ride-cta .btn { background: #fff; color: var(--meadow-deep); box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
.foot { display: flex; justify-content: center; }

/* play screens */
.trail { position: relative; height: 54px; margin: 0 6px; }
.trail .path { position: absolute; left: 0; right: 0; top: 30px; height: 10px; border-radius: 999px; background: repeating-linear-gradient(90deg, #D9C3A5 0 14px, #CDB491 14px 28px); }
.trail .post { position: absolute; top: 25px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--card); border: 3px solid var(--line); }
.trail .post.ok { background: var(--meadow); border-color: var(--meadow-deep); }
.trail .post.miss { background: var(--gold); border-color: var(--gold-deep); }
.trail .rider { position: absolute; top: -8px; width: 56px; margin-left: -28px; transition: left .6s cubic-bezier(.3, 1.4, .5, 1); }
.play { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
.qcard { display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
.tag { align-self: flex-start; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--meadow-deep); background: var(--meadow-soft); padding: 3px 12px; border-radius: 999px; }
.qtext { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.qtext.story { font-family: var(--body); font-weight: 400; font-size: 23px; line-height: 1.55; }
.qtext.mid { font-size: 30px; line-height: 1.3; }
.qtext.mid b { color: var(--peach); }
.pieces { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.pg { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; max-width: 100%; }
svg.areasvg { width: 100%; max-width: 480px; height: auto; display: block; }
.ar { fill: var(--card); stroke: var(--lav); stroke-width: 2.5; }
.ar.cur { fill: var(--gold-soft); stroke: var(--gold-deep); stroke-width: 3.5; }
.ar.done { fill: var(--meadow-soft); stroke: var(--meadow); }
.agrid { stroke: var(--lav); stroke-opacity: .35; stroke-width: 1; fill: none; }
.alab { font: 700 17px var(--display); fill: var(--lav); }
.aval { font: 800 19px var(--display); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; }
.nb { min-height: 50px; border-radius: 12px; border: 3px solid var(--line); background: var(--sky); font: 800 20px var(--display); font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
.nb.on { background: var(--lav-soft); border-color: var(--lav); }
.nb.bad { border-color: var(--warn); background: #FFF0E4; }
.nb.good { border-color: var(--meadow); background: var(--meadow-soft); }
.seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); flex: none; }
.seg button { border: 0; background: var(--card); padding: 6px 10px; font-size: 14px; font-weight: 700; min-height: 40px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.on { background: var(--meadow); color: #fff; }
.hints { display: flex; flex-direction: column; gap: 10px; }
.hint { background: var(--lav-soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: pop .25s ease-out; }
.hint .hn { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--lav); letter-spacing: .05em; text-transform: uppercase; }
.reveal { background: var(--gold-soft); border: 2px solid var(--gold); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.feedback { font-family: var(--display); font-weight: 700; font-size: 22px; min-height: 1px; }
.feedback.good { color: var(--meadow-deep); }
.feedback.try { color: var(--warn); }
.pad { display: flex; flex-direction: column; gap: 12px; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; }
.ansbox { display: flex; align-items: center; justify-content: center; gap: 10px; }
.slot { min-width: 120px; height: 72px; border-radius: 16px; border: 3px solid var(--line); background: var(--sky); font-family: var(--display); font-weight: 800; font-size: 38px; padding: 0 12px; font-variant-numeric: tabular-nums; }
.slot.wide { min-width: 190px; }
.slot.on { border-color: var(--lav); background: var(--card); box-shadow: 0 0 0 4px var(--lav-soft); }
.rlabel { font-family: var(--display); font-weight: 800; font-size: 32px; color: var(--ink-soft); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { min-height: 64px; border-radius: 16px; border: 0; background: var(--sky); box-shadow: 0 4px 0 var(--sky-deep); font-family: var(--display); font-weight: 800; font-size: 30px; user-select: none; -webkit-user-select: none; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }
.key.alt { background: var(--lav-soft); box-shadow: 0 4px 0 #D5CCF2; font-size: 24px; }
.padrow { display: flex; gap: 10px; }
.padrow .btn { flex: 1; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }

/* area model, partial quotients, bar model */
.scroll-x { overflow-x: auto; max-width: 100%; }
table.area { border-collapse: separate; border-spacing: 4px; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
table.area th { color: var(--lav); padding: 2px 8px; text-align: center; }
table.area td { background: var(--card); border: 2px solid var(--lav); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 64px; }
table.rtab { border-collapse: collapse; font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
table.rtab th { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); padding: 2px 18px; }
table.rtab td { border: 2px solid var(--line); background: var(--card); padding: 6px 22px; text-align: center; }
table.rtab .q { color: var(--rose); }
table.pq { border-collapse: collapse; font-size: 18px; font-variant-numeric: tabular-nums; }
table.pq th { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); text-align: right; padding: 2px 10px; }
table.pq td { padding: 3px 10px; text-align: right; border-top: 1px solid var(--line); }
svg.bm { width: 100%; max-width: 380px; height: auto; display: block; }
.bml { font: 700 13px var(--display); fill: var(--ink); }
.bmc { fill: var(--sky); stroke: var(--meadow-deep); stroke-width: 2; }
.bmc.q { fill: var(--gold-soft); stroke: var(--gold-deep); }
.bmt { font: 700 13px var(--display); fill: var(--ink); }
.bmtot { font: 800 15px var(--display); fill: var(--rose-deep); }

/* choices */
.choices { display: grid; gap: 12px; }
.choices.cols { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice { text-align: left; border-radius: 18px; border: 3px solid var(--line); background: var(--card); padding: 12px 14px; font-size: 19px; box-shadow: 0 3px 0 var(--line); }
.choice.bad { border-color: var(--warn); background: #FFF0E4; }
.choice.good { border-color: var(--meadow); background: var(--meadow-soft); }
.ops { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ops .choice { text-align: center; font-family: var(--display); font-weight: 800; font-size: 44px; padding: 6px; }

/* teach */
.foalrow { display: flex; gap: 14px; align-items: flex-end; }
.foalrow svg { width: 150px; flex: none; }
.board { background: #2F5E4C; color: #F4F7F2; border-radius: 18px; border: 8px solid #A57B55; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.board .bq { font-family: var(--display); font-weight: 700; font-size: 22px; }
.step { display: flex; gap: 10px; align-items: center; text-align: left; background: rgba(255, 255, 255, .08); border: 2px dashed rgba(255, 255, 255, .25); color: inherit; border-radius: 12px; padding: 8px 12px; font-size: 21px; font-variant-numeric: tabular-nums; }
.step .sn { font-family: var(--display); font-weight: 800; font-size: 15px; background: rgba(255, 255, 255, .18); border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
.step.tap { cursor: pointer; border-style: solid; border-color: rgba(255, 255, 255, .5); }
.step.wrongpick { border-color: var(--gold); background: rgba(242, 181, 48, .15); }
.step.found { border-color: #FF8FB0; background: rgba(228, 80, 122, .3); }
.say { background: var(--card); border: 2px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-size: 18px; }

/* gallop */
.lane { position: relative; height: 110px; border-radius: 22px; background: linear-gradient(#BFE3C9, #9ED1AE); border: 2px solid var(--line); overflow: hidden; }
.lane .finish { position: absolute; right: 16px; top: 0; bottom: 0; width: 18px; background: repeating-linear-gradient(0deg, #fff 0 9px, var(--ink) 9px 18px); opacity: .85; }
.lane .runner { position: absolute; bottom: 4px; width: 92px; margin-left: 6px; transition: left .35s ease-out; }
.lane .ghost { opacity: .35; filter: grayscale(1); transition: left .1s linear; }
.lane .rail { position: absolute; left: 0; right: 0; bottom: 40px; height: 4px; background: rgba(255, 255, 255, .6); }
.factbig { font-family: var(--display); font-weight: 800; font-size: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.clock { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 48px; min-width: 64px; padding: 6px 16px; border-radius: 14px; border: 3px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 700; font-size: 19px; }
.chip.on { border-color: var(--rose); background: var(--rose-soft); }

/* shop & badges */
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); padding: 0; flex: none; }
.sw.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--lav-soft); }
.pv { display: block; width: 104px; height: 88px; border-radius: 14px; background: var(--sky); overflow: hidden; border: 2px solid var(--line); }
.pv svg { width: 100%; height: 100%; display: block; }
.pv.empty { display: grid; place-items: center; color: var(--ink-soft); font-size: 14px; }
.outfits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.outfit { display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: 0; }
.outfit .pv { width: 100%; }
.item { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.item.on { border-color: var(--meadow); box-shadow: 0 0 0 3px var(--meadow-soft); }
.swatch { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-size: 34px; }
.item b { font-family: var(--display); font-size: 18px; line-height: 1.2; }
.price { display: inline-flex; gap: 4px; align-items: center; font-family: var(--display); font-weight: 700; }
.price .coin { width: 18px; height: 18px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.rosettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.rosette { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rosette svg { width: 72px; height: 92px; }
.rosette.locked svg { filter: grayscale(1); opacity: .3; }
.rosette b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.rosette span { font-size: 14px; color: var(--ink-soft); line-height: 1.3; }
.skillrow { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.shoes { display: flex; gap: 4px; justify-content: flex-end; }
.shoes svg { width: 30px; height: 30px; color: var(--line); }
.shoes svg.on { color: var(--gold-deep); }

/* forms & parent */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.input { min-height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); padding: 8px 14px; font-size: 20px; width: 100%; }
.pinbox { font-family: var(--display); font-size: 40px; letter-spacing: .4em; text-align: center; }
.study { background: var(--card); border: 3px solid var(--lav); border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.study.done { border-color: var(--meadow); background: var(--meadow-soft); }
.study h2 { font-size: 26px; }
.study .big { font-family: var(--display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; color: var(--lav); }
.study .meter i { background: var(--lav); }

<script>

  flame: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#F07A3A"/><path d="M12 13c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1.5 1-2.5 3-5z" fill="#FFC94A"/></svg>',

  grid: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 5v14" stroke="currentColor" stroke-width="2.2"/><path d="M5.2 5v14M8.4 5v14M11.6 5v14M18.4 5v14M2 8.5h20M2 12h20M2 15.5h20" stroke="currentColor" stroke-width=".8" opacity=".6"/></svg>',
  clock: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 8.5V13l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9.5 2.5h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const shoeSvg = on => `<svg class="${on ? "on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v8a7 7 0 0 0 14 0V3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`;

/* ============================== state & saving ============================== */
const STORE_KEY = "unicorn-academy-v1";
function fresh() {
  return {
    v: 1, updatedAt: 0, profile: null,
    look: { body: "#FFFFFF", mane: "#F27DA5", tail: null, maneStyle: "flowing", horn: "gold", hornOn: true, eyes: "#3A3550", hooves: "#7A5A4A", scene: "meadow", saddle: null, reins: null, acc: {}, marks: {} },
    custom: {}, outfits: [null, null, null],
    owned: ["body_white", "mane_pink", "scene_meadow"],
    coins: 0, streak: 0, bestStreak: 0, lastDay: null,
    stats: { problems: 0, correct: 0, rides: 0, perfect: 0, lessons: 0, gallops: 0, facts: 0, workshop: 0, homework: 0, days: 0, treats: 0, bought: 0, studyDone: 0 },
    skills: {}, facts: {}, placement: null, badges: {}, log: {}, mistakes: [], homework: [], focus: null,
    foals: [
      { name: "Pip", coat: "#F6E7CF", mane: "#8A5A3B", lessons: 0 },
      { name: "Clover", coat: "#D9B48F", mane: "#5B3A29", lessons: 0 },
      { name: "Biscuit", coat: "#C9CDD6", mane: "#59607A", lessons: 0 }
    ],
    rewards: [], gallopBest: {},
    plan: {
      program: "Bridges in Mathematics", where: "Unit 2, Module 1",
      note: "Extra practice reading and writing numbers in different forms. Multiplying with tens and hundreds (70 × 10, 20 × 30). Area models: base ten pieces, then graph paper, then open area models with no unit squares. Division stays close to the basic facts, with some remainders.",
      status: { pvr: "now", pvf: "now", m10: "now", fp: "now", m1d: "now", mfacts: "now", dfacts: "review", div: "review", wpc: "review", wpm: "review", wpr: "review", m2d: "off" }
    },
    // Study time set by a grown-up: a daily goal and/or a one-off session (minutes of practice).
    study: { daily: 0, lockShop: false, session: null, dailyDone: null, history: [] },
    settings: { sound: true, race: true, speak: true, divNear: true, pin: null }

}
function merge(base, add) {
  if (!add || typeof add !== "object" || Array.isArray(add)) return add === undefined ? base : add;
  const out = { ...base };
  for (const k of Object.keys(add)) out[k] = (base && typeof base[k] === "object" && !Array.isArray(base[k]) && base[k] !== null) ? merge(base[k], add[k]) : add[k];
  return out;
}
// This browser keeps a copy of each rider's progress, so a short server outage loses nothing.
function loadLocal(id) { try { const raw = localStorage.getItem(STORE_KEY + ":" + id); return raw ? merge(fresh(), JSON.parse(raw)) : null; } catch (e) { return null; } }
let S = fresh();
/* The home server keeps every rider's progress (server/riders.js). */
const RIDER_KEY = "unicorn-academy-rider";
const server = { rider: null, riderCount: 0, timer: null, writing: false, pending: false, ok: false, warned: false, status: { homework: false, maxImages: 4 } };
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: opts.body ? { "Content-Type": "application/json" } : {} });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.error && (data.error.message || data.error)) || res.statusText);
    err.status = res.status; err.code = data && data.error && data.error.code; err.data = data;
    throw err;
  }

}
function rememberRider(id) { try { localStorage.setItem(RIDER_KEY, String(id)); } catch (e) {} }
function cacheLocal() { if (server.rider) try { localStorage.setItem(STORE_KEY + ":" + server.rider, JSON.stringify(S)); } catch (e) {} }
function trim() {
  S.mistakes = S.mistakes.slice(-40);
  S.homework = S.homework.slice(-6);
  S.study.history = S.study.history.slice(-30);
  const keys = Object.keys(S.log).sort();
  for (const k of keys.slice(0, Math.max(0, keys.length - 90))) delete S.log[k];
}
function save() {
  S.updatedAt = Date.now();
  trim();
  cacheLocal();
  clearTimeout(server.timer);
  server.timer = setTimeout(pushState, 800);
}
async function pushState() {
  if (!S.profile) return;
  if (server.writing) { server.pending = true; return; }
  server.writing = true;
  try {
    if (!server.rider) {
      const r = await api("/api/riders", { method: "POST", body: "{}" });
      server.rider = r.id; server.riderCount++; rememberRider(r.id); cacheLocal();

    await api(`/api/riders/${server.rider}/state`, { method: "PUT", body: JSON.stringify({ state: S, updatedAt: S.updatedAt }) });

      toast("Loaded newer progress from another device.");
      if (current === "home") go("home");

      server.ok = false;
      if (!server.warned) { server.warned = true; toast("Can't reach the home server. Progress is kept on this device until it's back.", 4500); }
    }
  }
  server.writing = false;
  if (server.pending) { server.pending = false; pushState(); }

// Retry unsaved progress every 30 seconds while the server is unreachable.
setInterval(() => { if (!server.ok && S.profile && !server.writing) pushState(); }, 30000);

/* ============================== progress bookkeeping ============================== */
function logDay(f) {
  const k = today();
  const L = S.log[k] || (S.log[k] = { p: 0, c: 0, sec: 0 });
  for (const [a, b] of Object.entries(f)) L[a] = (L[a] || 0) + b;
}
function markActive() {
  const t = today();
  if (S.lastDay === t) return;
  S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.lastDay = t;
  S.stats.days++;
}
function liveStreak() { return (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0; }
function addCoins(n) { S.coins += n; const el = $("#coinCount"); if (el) el.textContent = fmt(S.coins); }
function skill(id) { return S.skills[id] || (S.skills[id] = { m: 0.3, n: 0, c: 0 }); }

function updSkill(id, score) {
  if (!SKILLS[id]) return;
  const s = skill(id);
  s.m = Math.max(0.05, Math.min(0.98, s.m + 0.18 * (score - s.m)));

function recordMistake(p, given) {
  S.mistakes.push({ d: today(), skill: p.skill, q: plain(p.text).slice(0, 220), given, ans: ansText(p) });
}
// Let the timer count only while she's in an activity and the page is visible.
// Time on the app, counted once a second. Each day's log keeps:
//   app = seconds with the app open and in use (not the Grown-ups area)
//   sec = seconds spent practicing (activity screens set tracking = true)
// Counting stops after 2 minutes without a tap or key, and while the app is hidden.
let tracking = false, lastInput = Date.now(), unsavedSec = 0;
const IDLE_MS = 2 * 60 * 1000;
for (const ev of ["pointerdown", "keydown", "touchstart"]) document.addEventListener(ev, () => { lastInput = Date.now(); }, { passive: true, capture: true });

const inUse = () => !!S.profile && !document.hidden && Date.now() - lastInput < IDLE_MS && current !== "parent";
setInterval(() => {
  if (inUse()) {
    logDay(tracking ? { app: 1, sec: 1 } : { app: 1 });
    if (tracking) studyTick();
    if (++unsavedSec >= 30) { unsavedSec = 0; save(); }
  }
  paintStudy();
}, 1000);
const minutesText = m => `${m} minute${m === 1 ? "" : "s"}`;
const mmss = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
const mins = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };

/* ---------- study time ---------- */
// The goal that applies right now: an open session first, then the daily goal.
// A finished session still shows as "done" today, unless the daily goal is still open.
function studyGoal() {
  const st = S.study, t = today();
  if (st.session && !st.session.completed) return { kind: "session", goal: st.session.goal * 60, done: st.session.sec, completed: false };
  if (st.daily > 0) return { kind: "daily", goal: st.daily * 60, done: Math.min((S.log[t] || {}).sec || 0, st.daily * 60), completed: st.dailyDone === t };
  if (st.session && st.session.d === t) return { kind: "session", goal: st.session.goal * 60, done: st.session.sec, completed: true };
  return null;
}
function studyLeft() { const g = studyGoal(); return g && !g.completed ? Math.max(0, g.goal - g.done) : 0; }
function studyTick() {
  const st = S.study;
  if (st.session && !st.session.completed) {
    st.session.sec++;
    if (st.session.sec >= st.session.goal * 60) completeStudy("session");
  } else if (st.daily > 0 && st.dailyDone !== today() && ((S.log[today()] || {}).sec || 0) >= st.daily * 60) completeStudy("daily");
}
function completeStudy(kind) {
  const st = S.study, goal = kind === "session" ? st.session.goal : st.daily;
  if (kind === "session") { st.session.completed = true; st.session.d = today(); }
  else st.dailyDone = today();

  S.stats.studyDone++;
  addCoins(25);
  finishActivity();
  sfx.win();
  modal(`${unicornSVG({ cls: "", still: false }).replace('class="uni', 'style="width:180px" class="uni')}<h2>Study time done!</h2><p style="font-size:20px">You practiced for <b>${minutesText(goal)}</b>. Great work, ${esc(S.profile.name)}!</p><p class="price" style="font-size:22px;justify-content:center"><span class="coin"></span> +25 coins</p><p class="muted">You can keep riding, or take a break.</p>`, [{ label: "Yay!", cls: "gold" }]);
}
function paintStudy() {
  const left = studyLeft(), running = tracking && inUse();
  const pill = $("#studyPill");
  if (pill) {

let actx = null;
function tone(freqs, dur = 0.12, type = "sine") {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i * dur;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.8);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur * 2);
    });
  } catch (e) {}
}

function pickSkill(last, focus) {
  const ids = activeSkills();
  const focusOn = focus && focus.until >= today() && focus.skills.length;
  const w = ids.map(id => {
    let x = Math.pow(1.15 - skill(id).m, 2) + 0.04;
    if (planOf(id) === "now") x *= 3;
    if (focusOn && focus.skills.includes(id)) x *= 4;
    if (last.length >= 2 && last.slice(-2).every(s => s === id)) x = 0;
    return x;
  });
  let t = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ids.length; i++) { t -= w[i]; if (t <= 0) return ids[i]; }
  return ids[0];
}
SCREENS.trail = (arg = {}) => {
  tracking = true;
  const total = arg.list ? arg.list.length : 8;
  const results = [], last = [], extra = [];
  let i = 0, firstTryAll = true, earned = 0;
  const only = arg.skills;
  function nextProblem() {
    if (arg.list) return arg.list[i];
    if (extra.length) return extra.shift();
    const s = only ? pick(only) : pickSkill(last, S.focus);
    last.push(s);
    return G[s](levelOf(s));
  }
  function step() {
    if (i >= total) return finish();
    const p = nextProblem();
    problemView(p, {
      title: arg.title || "Trail Ride", hints: true,
      progress: trailBar(results, total, i),
      coinFor: (tries, shown) => tries === 0 && shown === 0 ? 10 : 5,
      onMiss: given => recordMistake(p, given)
    }, r => {
      results.push(r.right);
      S.stats.problems++;
      if (r.right) { S.stats.correct++; const c = r.firstTry && !r.usedHints ? 10 : 5; addCoins(c); earned += c; }
      if (!(r.right && r.firstTry && !r.usedHints)) firstTryAll = false;
      if (SKILLS[p.skill]) updSkill(p.skill, r.right ? (r.firstTry && !r.usedHints ? 1 : 0.55) : 0);
      if (p.fact && p.key) factStat(p.key, r.right && r.firstTry);
      logDay({ p: 1, c: r.right ? 1 : 0 });
      if (!r.right && !arg.list && extra.length === 0 && SKILLS[p.skill] && i < total - 1) extra.push(G[p.skill](levelOf(p.skill)));
      i++;
      save();
      step();
    });
  }
  function finish() {
    S.stats.rides++;
    if (firstTryAll && total >= 5) S.stats.perfect++;
    logDay({ rode: 1 });
    addCoins(30); earned += 30;
    finishActivity();
    sfx.win();
    const right = results.filter(Boolean).length;
    app.innerHTML = `${topbar(arg.title || "Trail Ride")}
    ${trailBar(results, total, total)}
    <div class="card stack center" style="max-width:640px;margin:0 auto">

      <p style="font-size:22px">You got <b>${right} of ${total}</b>${firstTryAll && total >= 5 ? ", all on the first try. That's a <b>Clear Round</b>!" : ". Every problem made your brain stronger."}</p>
      <p class="price" style="font-size:24px"><span class="coin" style="width:26px;height:26px"></span> +${earned} coins</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-go="home">Back to the stable</button><button class="btn" data-go="shop">Visit the shop</button></div>
    </div>`;
    sparkle($("h1"));
  }
  step();
};

/* ---------- teach the foals ---------- */
function foalScenario() {
  const map = { place: "m1d", missing: "m2d", fact: "m1d", rembig: "div", op: "wpc", trailer: "wpr", add: "m1d", right: "m1d", zero: "pvr", tt: "m10", dv: "pvf", miss: "fp", odd: "fp", ratio: "rt" };
  const t = pick(Object.entries(map).filter(([, s]) => planOf(s) !== "off").flatMap(([k, s]) => planOf(s) === "now" ? [k, k] : [k]));
  const N = (a, b) => rnd(a, b);
  if (t === "ratio") {
    const k = N(12, 25), m = pick([12, 13, 15]);
    return { q: `A horse gallops ${k} feet every second. How far does it go in ${m} seconds?`, story: true, steps: [`1 second = ${k} feet`, `${m} seconds = ${m} + ${k} = ${m + k} feet`], wrong: 1, answer: m * k, kind: "num", fixQ: `How far does it really go in ${m} seconds?`,
      why: [[`Each second adds another ${k} feet, so multiply: ${m} × ${k}.`, true], [`It should be ${k} − ${m}.`], [`1 second is really ${m} feet.`]],
      lesson: `10 seconds = ${10 * k} feet and ${m - 10} more seconds = ${(m - 10) * k} feet. Together that's ${m * k} feet.` };
  }
  if (t === "miss") {
    const n = pick([12, 18, 20, 30, 36, 40, 42, 48]), f = factorsOf(n);
    const d = pick(f.filter(x => x > 2 && x * x < n)), steps = [];
    for (let k = 1; k * k <= n; k++) steps.push(n % k || k === d ? `Try ${k}: doesn't work` : `Try ${k}: ${k} × ${n / k} = ${n} ✓`);
    const listed = f.filter(x => x !== d && x !== n / d);
    steps.push(`Factors: ${listed.join(", ")}`);
    return { q: `List all the factors of ${n}.`, story: true, steps, wrong: d - 1, answer: f.length, kind: "num", fixQ: `How many factors does ${n} really have?`,
      why: [[`${d} × ${n / d} = ${n}, so ${d} and ${n / d} are factors too!`, true], [`${n} has no other factors.`], [`You should start at ${n} and count down.`]],
      lesson: `The factors of ${n} are ${f.join(", ")}.` };
  }

function factPool(set) {
  const out = [];
  if (set === "mx") { for (let t = 2; t <= 12; t++) for (let n = 2; n <= 12; n++) if (t <= n) out.push(() => multFact(t, n)); }
  else if (set === "dx") { for (let t = 2; t <= 12; t++) for (let q = 2; q <= 12; q++) out.push(() => divFact(t, q)); }
  else { const t = +set.slice(1); for (let n = 1; n <= 12; n++) out.push(() => multFact(t, n)); }

function pickSkillFrom(ids) {
  const w = ids.map(id => Math.pow(1.15 - skill(id).m, 2) + 0.05);
  let t = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ids.length; i++) { t -= w[i]; if (t <= 0) return ids[i]; }
  return ids[0];
}

function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; });
}
async function shrink(file) {
  try {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { bmp = await loadImg(file); }
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}

    <h2>Last 14 days</h2>
    <div class="days">${days.map(k => { const l = S.log[k]; return `<div class="day ${l && l.p ? "on" : ""}" title="${k}: ${l ? l.p || 0 : 0} problems">${l && l.p ? l.p : ""}</div>`; }).join("")}</div>
    <div class="dlabels" style="margin-top:4px">${days.map(k => `<span>${new Date(k + "T12:00").toLocaleDateString("en-US", { weekday: "narrow" })}</span>`).join("")}</div>
    <p class="note" style="margin-top:8px">Green days show the number of problems she worked on.</p>
  </section>
  <section class="card sect">
    <h2>Match her class</h2>
    <div class="row" style="align-items:flex-end">
      <label class="f" for="planProg" style="flex:1;min-width:200px">Math program<input class="input" id="planProg" value="${esc(S.plan.program)}" maxlength="60"></label>
      <label class="f" for="planWhere" style="flex:1;min-width:200px">Where the class is now<input class="input" id="planWhere" value="${esc(S.plan.where)}" maxlength="60"></label>
    </div>
    <label class="f" for="planNote" style="margin-top:10px">Teacher's notes<textarea class="input" id="planNote" rows="3" maxlength="600" style="font-size:16px">${esc(S.plan.note)}</textarea></label>
    <p class="note" style="margin-top:8px">Homework Helper uses these notes when it writes hints. In Trail Rides, "In class now" skills come up about 3 times as often, and "Not yet" skills are left out.</p>
    ${Object.keys(SKILLS).map(id => `<div class="toggle"><span>${SKILLS[id].name}</span><span class="seg">${[["now", "In class now"], ["review", "Review"], ["off", "Not yet"]].map(([k, lab]) => `<button class="${planOf(id) === k ? "on" : ""}" data-ps="${id}:${k}">${lab}</button>`).join("")}</span></div>`).join("")}
    <div class="toggle"><span>Keep division close to the basic facts<br><span class="note">Like 23 ÷ 4 = 5 R 3. Turn off when the class moves on to bigger division.</span></span><button class="switch ${S.settings.divNear ? "on" : ""}" data-set="divNear" aria-label="Keep division close to the basic facts"></button></div>
  </section>
  <section class="card sect">
    <h2>Skills</h2>
    <p class="note">Estimated from her recent answers. Practice automatically leans toward the weaker skills.${S.placement ? ` Warm-up Ride placement taken ${S.placement.d}.` : ""}</p>
    ${Object.keys(SKILLS).map(id => { const s = skill(id), [lab, col] = status(s.m); return `<div class="skillrow" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)"><span><b>${SKILLS[id].name}</b><br><span class="note">${s.n} tries · ${s.n ? Math.round(s.c / s.n * 100) : 0}% eventually correct</span></span><span class="stack" style="gap:4px"><span style="color:${col};font-weight:700">${lab}</span><span class="meter"><i style="width:${Math.round(s.m * 100)}%;background:${col}"></i></span></span></div>`; }).join("")}
    ${weakFacts.length ? `<p style="margin-top:10px"><b>Facts to practice:</b> ${weakFacts.join(", ")}</p>` : ""}
  </section>
  <section class="card sect">
    <h2>Rewards</h2>
    <p class="note">Set a real-world reward. She sees the progress bar on her home screen.</p>
    <div class="stack" style="margin-top:10px">
      ${S.rewards.length ? S.rewards.map((r, i) => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px"><div style="min-width:0;flex:1"><b>${esc(r.title)}</b><br><span class="note">${rewardProgress(r)} / ${r.target} ${REWARD_TYPES[r.type]} · ${r.status === "active" ? "in progress" : r.status === "earned" ? "<b style='color:var(--rose)'>earned, ready to give</b>" : "given"}</span></div><div class="row">${r.status === "earned" ? `<button class="btn small gold" data-given="${i}">Mark as given</button>` : ""}<button class="btn small" data-del="${i}">Remove</button></div></div>`).join("") : `<p class="muted">No rewards yet.</p>`}
      <div class="row" style="align-items:flex-end">
        <label class="f" for="rwTitle" style="flex:2;min-width:200px">Reward<input class="input" id="rwTitle" placeholder="30 extra minutes of screen time" maxlength="60"></label>
        <label class="f" for="rwN" style="flex:0 0 110px">Goal<input class="input" id="rwN" inputmode="numeric" value="50"></label>
        <label class="f" for="rwType" style="flex:1;min-width:200px">Counting<select class="input" id="rwType">${Object.entries(REWARD_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        <button class="btn primary" id="rwAdd">Add reward</button>
      </div>
    </div>
  </section>
  <section class="card sect">
    <h2>Recent mistakes</h2>
    ${S.mistakes.length ? `<div class="tblwrap"><table class="list"><tr><th>Date</th><th>Skill</th><th>Problem</th><th>She said</th><th>Answer</th></tr>${S.mistakes.slice(-12).reverse().map(m => `<tr><td>${m.d.slice(5)}</td><td>${esc(SKILLS[m.skill]?.name || "Homework")}</td><td>${esc(m.q)}</td><td>${esc(m.given)}</td><td>${esc(m.ans)}</td></tr>`).join("")}</table></div>` : `<p class="muted">No mistakes recorded yet.</p>`}
  </section>
  <section class="card sect">
    <h2>Homework</h2>
    ${lastHw ? `<p><b>${esc(lastHw.title)}</b> <span class="note">(${lastHw.d})</span></p><p>${esc(lastHw.note || "")}</p>${S.focus && S.focus.until >= today() ? `<p class="note">Trail Rides are focusing on: ${S.focus.skills.map(s => SKILLS[s]?.name).filter(Boolean).join(", ")} until ${S.focus.until}.</p>` : ""}` : `<p class="muted">No homework added yet. Use Homework Helper to snap a worksheet.</p>`}
  </section>
  <section class="card sect">
    <h2>Settings</h2>
    <div class="toggle"><span>Sound effects</span><button class="switch ${S.settings.sound ? "on" : ""}" data-set="sound" aria-label="Sound effects"></button></div>
    <div class="toggle"><span>Allow timed races in Fact Gallop<br><span class="note">Turn off if timers make her anxious. Trot mode has no clock.</span></span><button class="switch ${S.settings.race ? "on" : ""}" data-set="race" aria-label="Timed races"></button></div>
    <div class="toggle"><span>"Read it to me" button on word problems</span><button class="switch ${S.settings.speak ? "on" : ""}" data-set="speak" aria-label="Read aloud"></button></div>
    <div class="row" style="margin-top:12px">
      <button class="btn small" id="redoPlace">Redo the Warm-up Ride</button>
      <button class="btn small" id="newPin">Change PIN</button>
      <button class="btn small" id="lockP">Lock</button>
      <button class="btn small" id="wipe" style="color:var(--rose-deep)">Reset everything</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn small" id="expBtn">Copy progress</button>
      <button class="btn small" id="impBtn">Paste progress</button>
    </div>
    <div class="stack" id="xferBox" style="margin-top:10px"></div>
    <p class="note" style="margin-top:10px">${server.ok ? `Progress is saved on your home server (rider #${server.rider}), so every device in the house sees the same progress.` : "Can't reach the home server right now. Progress is kept on this device and saved there when it's back."}</p>
    <div class="row" style="margin-top:6px"><button class="btn small" id="addRider">Add another rider</button>${server.riderCount > 1 ? `<button class="btn small" data-go="riders">Switch rider</button>` : ""}</div>
  </section>`;
  $("#planProg").onchange = e => { S.plan.program = e.target.value.trim(); save(); };
  $("#planWhere").onchange = e => { S.plan.where = e.target.value.trim(); save(); };
  $("#planNote").onchange = e => { S.plan.note = e.target.value.trim(); save(); };
  $$("[data-ps]").forEach(b => b.onclick = () => { const [id, st] = b.dataset.ps.split(":"); S.plan.status[id] = st; save(); b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
  bindStudySettings();
  $$("[data-set]").forEach(b => b.onclick = () => { const k = b.dataset.set; S.settings[k] = !S.settings[k]; b.classList.toggle("on", S.settings[k]); save(); });
  $("#rwAdd").onclick = () => {
    const title = $("#rwTitle").value.trim(), target = parseInt($("#rwN").value, 10), type = $("#rwType").value;
    if (!title || !(target > 0)) { $("#rwTitle").focus(); return; }
    S.rewards.push({ title, target, type, start: counter(type), status: "active", d: today() });
    save(); parentDash();
  };
  $$("[data-given]").forEach(b => b.onclick = () => { S.rewards[+b.dataset.given].status = "given"; save(); parentDash(); });
  $$("[data-del]").forEach(b => b.onclick = () => { S.rewards.splice(+b.dataset.del, 1); save(); parentDash(); });
  $("#redoPlace").onclick = () => { parentOpen = false; go("placement"); };
  $("#newPin").onclick = () => { S.settings.pin = null; parentOpen = false; save(); go("parent"); };
  $("#lockP").onclick = () => { parentOpen = false; go("home"); };
  // Move progress between copies of the app (e.g. claude.ai -> home server) or keep a backup.
  $("#addRider").onclick = () => { parentOpen = false; newRider(); };
  $("#expBtn").onclick = async () => {
    const text = JSON.stringify(S);
    try { await navigator.clipboard.writeText(text); toast("Progress copied. Paste it with Paste progress in the other copy."); }
    catch (e) {
      $("#xferBox").innerHTML = `<p class="note">Copy all of this text:</p><textarea class="input" id="xferText" rows="4" readonly style="font-size:12px"></textarea>`;
      $("#xferText").value = text; $("#xferText").focus(); $("#xferText").select();
    }
  };
  $("#impBtn").onclick = () => {
    $("#xferBox").innerHTML = `<p class="note">Paste the progress text here, then tap Import. This replaces this rider's progress.</p><textarea class="input" id="xferText" rows="4" style="font-size:12px"></textarea><button class="btn small primary" id="xferGo" style="align-self:flex-start">Import</button>`;
    $("#xferGo").onclick = () => {
      let d = null;
      try { d = JSON.parse($("#xferText").value); } catch (e) {}
      if (!d || typeof d !== "object" || !d.profile || !d.profile.name) { toast("That text doesn't look like Unicorn Academy progress."); return; }
      S = merge(fresh(), d);
      parentOpen = false; save();
      toast(`Welcome back, ${esc(S.profile.name)}!`);
      go("home");
    };
  };
  $("#wipe").onclick = () => modal(`<h2 style="color:var(--rose-deep)">Reset everything?</h2><p>This erases all progress, coins, rosettes and the unicorn. It can't be undone.</p>`, [
    { label: "Keep everything", cls: "" },
    { label: "Yes, reset", cls: "rose", fn: () => { S = fresh(); parentOpen = false; save(); go("welcome"); } }
  ]);
  cleanups.push(() => { parentOpen = false; });
}

/* ============================== boot ============================== */
function migratePlan() {
  if (S.planRev >= 2) return;
  S.plan.status = { ...S.plan.status, m2d: "now", rt: "now" };
  if (/Module 1/.test(S.plan.where || "")) S.plan.where = "Unit 2, Module 3";
  S.plan.note = (S.plan.note || "") + " Module 3: ratio tables (find 1 second, then build up), area of rectangles with 2-digit × 2-digit numbers, estimating first, and finding a missing dimension.";
  S.planRev = 2;
  if (S.profile) save();
}
function newRider() {
  S = fresh(); server.rider = null;
  go("welcome");
}
function startApp() {
  migratePlan();
  go(S.profile ? "home" : "welcome");
}
async function loadRider(id) {
  const cached = loadLocal(id);
  try {
    const r = await api(`/api/riders/${id}/state`);
    S = merge(fresh(), r.state); S.updatedAt = r.updatedAt;
    server.rider = id; server.ok = true; rememberRider(id);
    // Progress made while the server was down is newer: keep it and send it.
    if (cached && (cached.updatedAt || 0) > (r.updatedAt || 0)) { S = cached; pushState(); }
    cacheLocal();
  } catch (e) {
    if (!cached) return showServerDown();
    S = cached; server.rider = id; server.ok = false;
  }
  startApp();
}
function showServerDown() {
  current = "down";
  app.innerHTML = `<div class="card stack center" style="max-width:520px;margin:40px auto"><div style="width:220px">${unicornSVG({ look: DEFAULT_LOOK })}</div><h1 style="font-size:30px">Can't reach the stable</h1><p>The Unicorn Academy server isn't answering. Check that the iPad is on the home Wi-Fi, or ask a grown-up to check the server.</p><button class="btn primary" id="retry">Try again</button></div>`;
  $("#retry").onclick = boot;
}
SCREENS.riders = async () => {
  app.innerHTML = `<div class="card stack center" style="max-width:520px;margin:40px auto"><p class="muted">Opening the stable…</p></div>`;
  let list;
  try { list = (await api("/api/riders")).filter(r => r.name); } catch (e) { return showServerDown(); }
  if (current !== "riders") return;
  server.riderCount = list.length;
  app.innerHTML = `<header class="top"><h1 style="color:var(--meadow-deep)">Unicorn Academy</h1></header>
  <section class="card stack center">
    <h2 style="font-size:34px">Who's riding today?</h2>
    <div class="tiles" style="width:100%">${list.map(r => `<button class="tile t-teach" data-rider="${r.id}" style="align-items:center;text-align:center"><span style="width:120px">${unicornSVG({ look: DEFAULT_LOOK, still: true })}</span><h3>${esc(r.name)}</h3><p>with ${esc(r.uni || "a unicorn")}</p></button>`).join("")}
      <button class="tile t-work" id="newR" style="align-items:center;justify-content:center;text-align:center"><h3>+ New rider</h3><p>Start a new stable</p></button></div>
  </section>`;
  $$("[data-rider]").forEach(b => b.onclick = () => loadRider(+b.dataset.rider));
  $("#newR").onclick = newRider;
};
async function boot() {
  app.innerHTML = `<div class="card stack center" style="max-width:520px;margin:40px auto"><p class="muted">Saddling up…</p></div>`;
  let saved = 0;
  try { saved = +localStorage.getItem(RIDER_KEY) || 0; } catch (e) {}
  let list;
  try {
    server.status = await api("/api/status");
    list = (await api("/api/riders")).filter(r => r.name);
    server.ok = true;
  } catch (e) {
    // Server unreachable: carry on with this device's copy if there is one.
    const cached = saved && loadLocal(saved);
    if (!cached) return showServerDown();
    S = cached; server.rider = saved; server.ok = false;
    toast("Can't reach the home server. Progress is kept on this device until it's back.", 4500);
    return startApp();
  }
  server.riderCount = list.length;
  if (list.some(r => r.id === saved)) return loadRider(saved);
  if (list.length === 1) return loadRider(list[0].id);
  if (list.length > 1) return go("riders");
  newRider();
}
boot();
</script>
